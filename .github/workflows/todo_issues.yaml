name: TODO to Issue
on:
  push:
    branches:
      - main
    paths:
      - '**.gd'
  workflow_dispatch:

run-name: TODO issue processing for ${{ github.sha }}

jobs:
  todo-to-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot existing issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Snapshot step failed at line $LINENO."' ERR
          echo "::group::Snapshot existing issues"
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Fetching existing issue numbers..."
          gh issue list --state all --limit 1000 --json number --jq '.[].number' | sort -n > "$RUNNER_TEMP/issues-before.txt"
          BEFORE_COUNT=$(wc -l < "$RUNNER_TEMP/issues-before.txt")
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Found $BEFORE_COUNT existing issues."
          echo "::endgroup::"

      - name: Parse TODO and FIXME comments
        uses: alstr/todo-to-issue-action@v5
        with:
          INSERT_ISSUE_URLS: "true"
          CLOSE_ISSUES: "true"
          AUTO_ASSIGN: "true"
          IDENTIFIERS: >
            [
              {"name": "TODO", "labels": ["todo"]},
              {"name": "FIXME", "labels": ["bug"]}
            ]

      - name: Find issues created in this run
        id: created-issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Issue discovery failed at line $LINENO."' ERR
          echo "::group::Find issues created in this run"
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Fetching issue numbers after TODO processing..."
          gh issue list --state all --limit 1000 --json number --jq '.[].number' | sort -n > "$RUNNER_TEMP/issues-after.txt"
          BEFORE_COUNT=$(wc -l < "$RUNNER_TEMP/issues-before.txt")
          CREATED_ISSUES=$(comm -13 "$RUNNER_TEMP/issues-before.txt" "$RUNNER_TEMP/issues-after.txt" | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')
          CREATED_COUNT=$(echo "$CREATED_ISSUES" | jq 'length')
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Detected $CREATED_COUNT issue(s): $CREATED_ISSUES"
          echo "issue_numbers=$CREATED_ISSUES" >> "$GITHUB_OUTPUT"
          {
            echo "## TODO issue processing"
            echo
            echo "- Existing issues before processing: $BEFORE_COUNT"
            echo "- Issues created in this run: $CREATED_COUNT"
            echo "- Created issue numbers: \`$CREATED_ISSUES\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::endgroup::"

    outputs:
      issue_numbers: ${{ steps.created-issues.outputs.issue_numbers }}

  analyze-issues:
    needs: todo-to-issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Analyze Unprocessed TODOs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBERS: ${{ needs.todo-to-issue.outputs.issue_numbers }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Analysis step failed at line $LINENO."' ERR
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Starting analysis for issue numbers: $ISSUE_NUMBERS"

          if [ -z "$ISSUE_NUMBERS" ] || [ "$ISSUE_NUMBERS" == "[]" ]; then
            echo "No issues were created in this run."
            echo "- Analysis result: no new issues to analyze." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Loop through issues created by the TODO action in this run
          echo "$ISSUE_NUMBERS" | jq -r '.[]' | while read -r issue_number; do
            echo "::group::Analyze issue #$issue_number"
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Fetching issue details..."
            issue=$(gh issue view "$issue_number" --json number,title,body)
            ISSUE_NUM=$(echo "$issue" | jq -r '.number')
            ISSUE_TITLE=$(echo "$issue" | jq -r '.title')
            ISSUE_BODY=$(echo "$issue" | jq -r '.body')

            echo "Analyzing Issue #$ISSUE_NUM: $ISSUE_TITLE"

            # Isolate the exact file path from the injected GitHub permalink
            FILE_PATH=$(echo "$ISSUE_BODY" | grep -oP 'blob/[^/]+/\K[^#\s]+' | head -n 1) || true

            FILE_CONTENT=""
            if [ -n "$FILE_PATH" ] && [ -f "$FILE_PATH" ]; then
              FILE_CONTENT=$(cat "$FILE_PATH")
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Loaded source file: $FILE_PATH"
            elif [ -z "$FILE_PATH" ]; then
              echo "::warning::Could not extract a source file path from issue #$ISSUE_NUM."
            else
              echo "::warning::Source file not found for issue #$ISSUE_NUM: $FILE_PATH"
            fi

            PROMPT="You are an expert Godot 4 systems engineer. Analyze the following TODO/FIXME from the provided GDScript file.
            Do not hallucinate dependencies or nodes outside the provided context. Keep your response extremely short and to the point.

            Perform exactly two tasks:
            1. Evaluate and explain the TODO/FIXME based on the code logic. If the comment seems invalid, outdated, or unnecessary based on the surrounding code, explicitly state that.
            2. Suggest approaches to implement the TODO or resolve the FIXME. You do not need to provide exact code. If there are multiple valid architectural solutions, briefly state each one along with its primary pros and cons.

            Title: $ISSUE_TITLE
            Context: $ISSUE_BODY

            File Content ($FILE_PATH):
            \`\`\`gdscript
            $FILE_CONTENT
            \`\`\`"

            MAX_RETRIES=3
            ATTEMPT=1
            SUCCESS=0
            RESPONSE=""

            while [ $ATTEMPT -le $MAX_RETRIES ]; do
              echo "Attempt $ATTEMPT of $MAX_RETRIES: Calling Gemini API..."

              HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent?key=${GEMINI_API_KEY}" \
                -H 'Content-Type: application/json' \
                -d "{\"contents\": [{\"parts\": [{\"text\": $(echo "$PROMPT" | jq -Rs .)}]}]}")

              HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed '$d')
              HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Gemini response status: $HTTP_STATUS"

              if [ "$HTTP_STATUS" -eq 200 ]; then
                PARSED_TEXT=$(echo "$HTTP_BODY" | jq -r '.candidates[0].content.parts[0].text // empty')
                if [ -n "$PARSED_TEXT" ]; then
                  RESPONSE="$PARSED_TEXT"
                  SUCCESS=1
                  echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Gemini analysis received."
                  break
                fi
              fi

              echo "Attempt $ATTEMPT failed with status $HTTP_STATUS."
              ERROR_MESSAGE=$(echo "$HTTP_BODY" | jq -r '.error.message // empty' 2>/dev/null || true)
              if [ -n "$ERROR_MESSAGE" ]; then
                echo "::warning::Gemini error: $ERROR_MESSAGE"
              fi
              DELAY=$(( ATTEMPT * 5 ))
              echo "Sleeping for $DELAY seconds before retry..."
              sleep $DELAY
              ATTEMPT=$(( ATTEMPT + 1 ))
            done

            if [ $SUCCESS -eq 1 ]; then
              FINAL_COMMENT="> ⚠️ **Disclaimer:** *This analysis was generated by an AI (Gemini Flash-Lite). Mistakes can happen, so please review the architectural suggestions carefully before applying them.*

              $RESPONSE"

              gh issue comment "$ISSUE_NUM" -b "$FINAL_COMMENT"
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Analysis comment posted to issue #$ISSUE_NUM."
              echo "- Issue #$ISSUE_NUM: analysis completed and comment posted." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Failed to generate AI analysis for Issue #$ISSUE_NUM."
              echo "- Issue #$ISSUE_NUM: analysis failed." >> "$GITHUB_STEP_SUMMARY"
            fi

            # 2-second pause to prevent free-tier rate limits when processing multiple TODOs
            sleep 2
            echo "::endgroup::"
          done